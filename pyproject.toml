[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingrearchagents"
version = "0.1.0"
description = "Harness-neutral adapter and final research dossier for TauricResearch/TradingAgents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "tradingrearchagents contributors"}]
dependencies = ["mcp>=2.0,<3"]

[project.urls]
Repository = "https://github.com/harshitagarwal2/tradingrearchagents"
"Upstream TradingAgents" = "https://github.com/TauricResearch/TradingAgents"

[project.scripts]
tradingrearchagents = "tradingrearchagents.cli:main"
tradingrearchagents-mcp = "tradingrearchagents.mcp_server:main"
tradingrearchagents-legacy-mcp = "tradingrearchagents.legacy_mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
upstream = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@a33fd4c0f134485a43553a2c23a63cb14adbd88f",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradingrearchagents = ["web/*.html", "web/*.js", "web/*.css", "workflow/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
