[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-agents"
dynamic = ["version"]
description = "StockResearchAgents: harness-neutral, evidence-first company research with a completed-only dossier viewer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "StockResearchAgents contributors"}]
keywords = ["agent", "company-research", "evidence", "mcp", "model-context-protocol", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/harshitagarwal2/StockResearchAgents"
Repository = "https://github.com/harshitagarwal2/StockResearchAgents"
Issues = "https://github.com/harshitagarwal2/StockResearchAgents/issues"
Changelog = "https://github.com/harshitagarwal2/StockResearchAgents/releases"

[project.scripts]
stock-research-agents = "stock_research_agents.cli:main"
stock-research-agents-mcp = "stock_research_agents.mcp_server:main"
stock-research-data-mcp = "stock_research_agents_host.research_data_mcp:main"

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "stock_research_agents._version.__version__"}

[tool.setuptools.package-data]
stock_research_agents = ["web/*.html", "web/*.js", "web/*.css", "workflow/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
