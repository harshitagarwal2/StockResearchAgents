# Merge this mapping into ~/.hermes/config.yaml after installing the package.
mcp_servers:
  stock-research-agents:
    command: stock-research-agents-mcp
    args: []
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
  stock-research-data:
    command: stock-research-data-mcp
    args: []
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
