name: live provider canary

on:
  schedule:
    - cron: "23 11 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-free-public-providers:
    name: SEC, GDELT, World Bank, and Polymarket
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install public adapter
        run: python -m pip install .
      - name: Run bounded sanitized provider probes
        run: >-
          timeout --kill-after=15s 360s python scripts/smoke_research_data.py
          --symbols ORCL META
          --strictness contract
          --output /tmp/live-provider-canary.json
      - name: Retain sanitized status and shape evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitized-live-provider-canary
          path: /tmp/live-provider-canary.json
          if-no-files-found: ignore
          retention-days: 7
