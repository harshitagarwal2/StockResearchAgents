name: live provider canary

on:
  schedule:
    - cron: "23 11 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-free-public-providers:
    name: SEC, GDELT, World Bank, and Polymarket
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install public adapter
        run: python -m pip install .
      - name: Run bounded sanitized provider probes
        run: >-
          timeout --kill-after=15s 360s python scripts/smoke_research_data.py
          --symbols ORCL META
          --strictness contract
          --output /tmp/live-provider-canary.json
      - name: Retain sanitized status and shape evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitized-live-provider-canary
          path: /tmp/live-provider-canary.json
          if-no-files-found: ignore
          retention-days: 7
