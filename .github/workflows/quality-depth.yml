name: quality-depth

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * 1"

permissions:
  contents: read

jobs:
  selective-mutation:
    name: Critical-boundary mutation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Prove critical tests kill representative mutants
        run: python scripts/run_mutation_smoke.py
