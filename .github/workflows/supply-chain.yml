name: supply chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned audit tools
        run: python -m pip install "uv==0.12.1" "pip-audit==2.10.1"
      - name: Export locked runtime requirements
        run: >-
          uv export
          --locked
          --no-dev
          --no-emit-project
          --format requirements.txt
          --output-file /tmp/stock-research-agents-runtime.txt
      - name: Audit locked runtime dependencies
        run: pip-audit --requirement /tmp/stock-research-agents-runtime.txt

  workflow-audit:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned workflow auditor
        run: python -m pip install "zizmor==1.29.0"
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows
