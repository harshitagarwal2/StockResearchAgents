name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: validate and build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine
      - name: Verify release metadata
        run: python scripts/verify_release_metadata.py --tag "$GITHUB_REF_NAME" --require-stable
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Documentation
        run: python scripts/check_docs.py
      - name: Tests
        run: pytest -q
      - name: Type check
        run: mypy --ignore-missing-imports src
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          "$smoke_dir/venv/bin/python" -m pip install dist/*.whl
          STOCKRESEARCHAGENTS_STATE_DIR="$smoke_dir/state" \
          "$smoke_dir/venv/bin/python" -c 'from stock_research_agents import discovery; value = discovery(); assert value["active_profile"] == "company-analytics.v1"; print(value["name"])' \
            > "$smoke_dir/discovery.txt"
          test -s "$smoke_dir/discovery.txt"
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stock-research-agents
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ff98106e4c7b2bc287b24eaf42907196329070c7 # release/v1
        with:
          packages-dir: dist/

  create-github-release:
    name: create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  publish-mcp-registry:
    name: publish MCP Registry metadata
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the official MCP Registry publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server metadata
        run: ./mcp-publisher publish
