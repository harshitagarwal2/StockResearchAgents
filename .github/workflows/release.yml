name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: validate and build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine
      - name: Verify release metadata
        run: python scripts/verify_release_metadata.py --tag "$GITHUB_REF_NAME" --require-stable
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Documentation
        run: python scripts/check_docs.py
      - name: Tests
        run: pytest -q
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          "$smoke_dir/venv/bin/python" -m pip install dist/*.whl
          STOCKRESEARCHAGENTS_STATE_DIR="$smoke_dir/state" \
          STOCKRESEARCHAGENTS_PRESENTATION_MODE=path_only \
          "$smoke_dir/venv/bin/stock-research-agents" fixture --events > "$smoke_dir/fixture.json"
          test -s "$smoke_dir/fixture.json"
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tradingagents-portable
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-github-release:
    name: create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  publish-mcp-registry:
    name: publish MCP Registry metadata
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install the official MCP Registry publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server metadata
        run: ./mcp-publisher publish
