name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: validate and build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Verify release metadata
        run: python scripts/verify_release_metadata.py --tag "$GITHUB_REF_NAME" --require-stable
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Documentation
        run: python scripts/check_docs.py
      - name: Tests
        run: pytest -q
      - name: Type check
        run: mypy --ignore-missing-imports src
      - name: Build distributions
        run: python -m build --outdir release/packages
      - name: Validate distribution metadata
        run: twine check --strict release/packages/*
      - name: Smoke-test wheel and sdist independently
        run: python scripts/smoke_installed_distribution.py release/packages/*.whl release/packages/*.tar.gz
      - name: Create SPDX SBOM
        run: >-
          python scripts/build_release_sbom.py
          release/packages/*.whl
          release/packages/*.tar.gz
          --lock-file uv.lock
          --output release/sbom.spdx.json
      - name: Create checksums
        working-directory: release
        run: sha256sum packages/* sbom.spdx.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error

  attest-release:
    name: attest release artifacts and SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release/
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/packages/*
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/packages/*
          sbom-path: release/sbom.spdx.json

  publish-pypi:
    name: publish to PyPI
    needs: attest-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stock-research-agents
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/packages/

  create-github-release:
    name: create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release/
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/packages/*
          release/SHA256SUMS
          release/sbom.spdx.json
          --title "$GITHUB_REF_NAME"
          --generate-notes

  publish-mcp-registry:
    name: publish MCP Registry metadata
    needs: create-github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the official MCP Registry publisher
        run: |
          publisher_archive="mcp-publisher_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$publisher_archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/$publisher_archive"
          printf '%s  %s\n' \
            'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac' \
            "$publisher_archive" | sha256sum --check
          tar -xzf "$publisher_archive" mcp-publisher
          chmod +x mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server metadata
        run: ./mcp-publisher publish
