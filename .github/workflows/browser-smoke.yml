name: browser accessibility smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completed-viewer:
    name: Completed viewer, session safety, and axe
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"
      - name: Install package
        run: python -m pip install .
      - name: Install locked browser tools
        run: npm ci --ignore-scripts --fund=false --audit=false
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise the completed-only loopback viewer
        env:
          PYTHON: python
        run: node scripts/browser_smoke.mjs
