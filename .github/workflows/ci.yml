name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Full verification (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STOCKRESEARCHAGENTS_STATE_DIR: /tmp/stock-research-agents-state
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build "uv==0.12.1"
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Browser JavaScript
        run: node --check src/stock_research_agents/web/app.js
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Type check
        run: mypy --ignore-missing-imports src
      - name: Documentation
        run: python scripts/check_docs.py
      - name: Tests with branch coverage
        run: coverage run -m pytest -q
      - name: Coverage report
        run: |
          coverage report --show-missing
          coverage xml -o coverage.xml
      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: branch-coverage-python-3.11
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Backend smoke
        run: python scripts/smoke_backend.py
      - name: MCP smoke
        run: python scripts/smoke_mcp.py
      - name: Build distribution
        run: python -m build

  python-compatibility:
    name: Compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      STOCKRESEARCHAGENTS_STATE_DIR: /tmp/stock-research-agents-state
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test package
        run: python -m pip install -e ".[dev]" "uv==0.12.1"
      - name: Compile Python
        run: python -m compileall -q src
      - name: Tests
        run: pytest -q
      - name: Backend smoke
        run: python scripts/smoke_backend.py
      - name: MCP smoke
        run: python scripts/smoke_mcp.py

  locked-environment:
    name: Reproducible locked environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STOCKRESEARCHAGENTS_STATE_DIR: /tmp/stock-research-agents-locked-state
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.1"
      - name: Synchronize the committed lock
        run: uv sync --locked --extra dev
      - name: Locked tests
        run: uv run pytest -q
      - name: Locked backend smoke
        run: uv run python scripts/smoke_backend.py
      - name: Locked MCP smoke
        run: uv run python scripts/smoke_mcp.py

  mcp-compatibility-edge:
    name: MCP compatibility (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            requirement: "mcp==2.0.0"
            pip-args: ""
          - label: latest-v2
            requirement: "mcp>=2,<3"
            pip-args: "--upgrade"
    env:
      STOCKRESEARCHAGENTS_STATE_DIR: /tmp/stock-research-agents-mcp-edge-state
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and MCP edge
        run: python -m pip install -e . ${{ matrix.pip-args }} "${{ matrix.requirement }}"
      - name: MCP contract tests
        run: >-
          pytest -q
          tests/test_manifests_and_mcp.py
          tests/test_company_analytics_cli_mcp.py
          tests/test_research_data_mcp.py
      - name: Installed entrypoint handshakes
        run: >-
          python scripts/smoke_installed_distribution.py
          --runtime
          --allow-editable
          --state-dir "$STOCKRESEARCHAGENTS_STATE_DIR"
