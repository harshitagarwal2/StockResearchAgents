name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Full verification (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STOCKRESEARCHAGENTS_STATE_DIR: /tmp/stock-research-agents-state
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build uv
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Browser JavaScript
        run: node --check src/stock_research_agents/web/app.js
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Type check
        run: mypy --ignore-missing-imports src
      - name: Documentation
        run: python scripts/check_docs.py
      - name: Tests
        run: pytest -q
      - name: Backend smoke
        run: python scripts/smoke_backend.py
      - name: MCP smoke
        run: python scripts/smoke_mcp.py
      - name: Build distribution
        run: python -m build

  python-compatibility:
    name: Compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      STOCKRESEARCHAGENTS_STATE_DIR: /tmp/stock-research-agents-state
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime package
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q src
      - name: Backend smoke
        run: python scripts/smoke_backend.py
      - name: MCP smoke
        run: python scripts/smoke_mcp.py
