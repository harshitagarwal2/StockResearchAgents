name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STOCKRESEARCHAGENTS_STATE_DIR: /tmp/stock-research-agents-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build uv
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Browser JavaScript
        run: node --check src/tradingagents_portable/web/app.js
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Documentation
        run: python scripts/check_docs.py
      - name: Upstream pin consistency
        run: python scripts/upstream_pin.py --check
      - name: Tests
        run: pytest -q
      - name: Legacy transition remains blocked
        run: python scripts/verify_legacy_removal.py --expect-blocked
      - name: Backend smoke
        run: python scripts/smoke_backend.py
      - name: MCP smoke
        run: python scripts/smoke_mcp.py
      - name: Build distribution
        run: python -m build

  upstream-semantic-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STOCKRESEARCHAGENTS_STATE_DIR: /tmp/stock-research-agents-upstream-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TauricResearch/TradingAgents
          ref: a33fd4c0f134485a43553a2c23a63cb14adbd88f
          path: .upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install portable and pinned upstream
        run: python -m pip install -e ".[dev]" -e ./.upstream
      - name: Run upstream-dependent tests
        env:
          TRADINGAGENTS_UPSTREAM_PATH: .upstream
        run: pytest -q tests/test_conformance.py tests/test_upstream_semantic_differential.py
      - name: Compare scoped observable semantics
        run: >-
          python scripts/run_upstream_semantic_probe.py
          --upstream-path .upstream
          --require-clean-portable
          --output upstream-semantic-differential.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-semantic-differential
          path: upstream-semantic-differential.json
