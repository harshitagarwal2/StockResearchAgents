name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned upstream TradingAgents contract
        run: |
          git init "$GITHUB_WORKSPACE/../tradingAgents"
          git -C "$GITHUB_WORKSPACE/../tradingAgents" remote add origin https://github.com/TauricResearch/TradingAgents.git
          git -C "$GITHUB_WORKSPACE/../tradingAgents" fetch --depth=1 origin a33fd4c0f134485a43553a2c23a63cb14adbd88f
          git -C "$GITHUB_WORKSPACE/../tradingAgents" checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build uv
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Browser JavaScript
        run: node --check src/tradingagents_portable/web/app.js
      - name: Tests
        run: pytest -q
      - name: Backend smoke
        run: python scripts/smoke_backend.py
      - name: MCP smoke
        run: python scripts/smoke_mcp.py
      - name: Build distribution
        run: python -m build
