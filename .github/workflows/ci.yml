name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build uv
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Browser JavaScript
        run: node --check src/tradingagents_portable/web/app.js
      - name: Tests
        run: pytest -q
      - name: Backend smoke
        run: python scripts/smoke_backend.py
      - name: MCP smoke
        run: python scripts/smoke_mcp.py
      - name: Build distribution
        run: python -m build
