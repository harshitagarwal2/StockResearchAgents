name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned upstream TradingAgents contract
        uses: actions/checkout@v4
        with:
          repository: TauricResearch/TradingAgents
          ref: a33fd4c0f134485a43553a2c23a63cb14adbd88f
          path: upstream-tradingagents
          persist-credentials: false
      - name: Expose upstream checkout to conformance tests
        run: ln -s "$GITHUB_WORKSPACE/upstream-tradingagents" "$GITHUB_WORKSPACE/../tradingAgents"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build uv
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Browser JavaScript
        run: node --check src/tradingagents_portable/web/app.js
      - name: Tests
        run: pytest -q
      - name: Backend smoke
        run: python scripts/smoke_backend.py
      - name: MCP smoke
        run: python scripts/smoke_mcp.py
      - name: Build distribution
        run: python -m build
