name: validate pre-release on TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release-candidate tag, for example v0.2.0rc1
        required: true
        type: string

permissions: {}

concurrency:
  group: testpypi-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate and build pre-release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.value }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - id: package-version
        name: Verify package and tag identity
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          version="$(python scripts/verify_release_metadata.py --tag "$RELEASE_REF" --package-only --print-version)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Documentation
        run: python scripts/check_docs.py
      - name: Tests
        run: pytest -q
      - name: Type check
        run: mypy --ignore-missing-imports src
      - name: Build distributions
        run: python -m build --outdir release/packages
      - name: Validate distribution metadata
        run: twine check --strict release/packages/*
      - name: Smoke-test wheel and sdist independently
        run: python scripts/smoke_installed_distribution.py release/packages/*.whl release/packages/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions-testpypi
          path: release/packages/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/stock-research-agents
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-testpypi
          path: release/packages/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/packages/
          repository-url: https://test.pypi.org/legacy/

  smoke-test-published-package:
    name: clean-install smoke test
    needs:
      - validate
      - publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the published TestPyPI package
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          for attempt in $(seq 1 12); do
            if "$smoke_dir/venv/bin/python" -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "stock-research-agents==$PACKAGE_VERSION"; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              exit 1
            fi
            sleep 10
          done
          "$smoke_dir/venv/bin/python" scripts/smoke_installed_distribution.py \
            --runtime \
            --state-dir "$smoke_dir/state"
