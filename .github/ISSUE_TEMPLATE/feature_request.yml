name: Feature request
description: Propose a bounded capability, contract, adapter, or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integrator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation preference.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - Versioned contract
        - Validation or deterministic analytics
        - Lifecycle, persistence, or recovery
        - MCP, CLI, or Python interface
        - Source adapter
        - Viewer or export projection
        - Documentation or developer experience
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and alternatives
      description: Note compatibility, provenance, entitlement, safety, or migration concerns and alternatives considered.
  - type: checkboxes
    id: safety
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not add broker integration, order execution, or portfolio mutation.
          required: true
        - label: This request preserves explicit fixture, replay, live-data, provenance, and coverage status.
          required: true
